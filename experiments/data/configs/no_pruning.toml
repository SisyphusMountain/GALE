# Ablation: no adjoint pruning. The backward pass skips a clade when the largest entry of its incoming adjoint is below
# adjoint_pruning_threshold (1e-6). use_adjoint_pruning = false now keeps every clade whose adjoint is not exactly zero
# (skipping those changes nothing). In the code the paper's runs used, false alone kept the threshold and skipped the
# same clades as pruning on, so this file also sets the threshold 0, which gives the same result in both.
# See measure/pruning_check.py.
[solver]
use_adjoint_pruning = false
adjoint_pruning_threshold = 0.0
